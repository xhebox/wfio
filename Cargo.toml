[package]
name = "wfio"
version = "0.1.0"
edition = "2024"
description = "Lightweight fio-compatible disk I/O benchmark library and CLI"
license = "MIT"
repository = "https://github.com/xhebox/wfio"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[lib]
name = "wfio"
path = "src/lib.rs"

[[bin]]
name = "wfio"
path = "src/main.rs"

[dependencies]
argh = "0.1"
completion = { package = "completion-async", version = "0.2.4" }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await", "async-await-macro"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
len_without_is_empty = "allow"
len_zero = "allow"
print_stderr = "deny"
print_stdout = "deny"
pub_underscore_fields = "deny"
redundant_pub_crate = "deny"
tabs_in_doc_comments = "allow"
wildcard_imports = "deny"
